server {
    listen 80;
    server_name design.pikaprint.store;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name design.pikaprint.store;
    ssl_certificate /etc/letsencrypt/live/design.pikaprint.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/design.pikaprint.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 15m;
    location / {
        proxy_pass http://127.0.0.1:8876;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
