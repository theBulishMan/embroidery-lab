<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号设置 · Pika 刺绣工作台</title><link rel="stylesheet" href="/auth.css"></head><body><main class="console">
<header class="console-header"><a href="/" class="brand"><span class="brand-mark" aria-hidden="true">p<span>·</span></span><span>PIKA<span class="brand-sub">刺绣工作台</span></span></a><nav class="console-nav"><a href="/">返回工作台 ↗</a><a id="admin-link" href="/admin" hidden>邀请码管理</a><button id="logout" class="text-button">退出</button></nav></header>
<div class="console-title"><p class="eyebrow">YOUR ACCOUNT</p><h1>账号设置</h1><p id="account-name">正在读取账号…</p></div>
<section class="console-section account-form"><h2>修改登录密码</h2><p class="section-copy">修改成功后，其他浏览器上的登录会失效。当前页面保持登录。</p><form id="password-form"><label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password" maxlength="128" required><label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="至少 10 个字符" required><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><p id="account-status" class="console-status" role="status" aria-live="polite"></p><button id="save-password" class="primary-action" type="submit"><span>保存新密码</span><span aria-hidden="true">↗</span></button></form></section>
</main><script type="module" src="/account.js"></script></body></html>
