<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邀请码与账号 · Pika 刺绣工作台</title><link rel="stylesheet" href="/auth.css"></head><body><main class="console">
<header class="console-header"><a href="/" class="brand"><span class="brand-mark" aria-hidden="true">p<span>·</span></span><span>PIKA<span class="brand-sub">刺绣工作台</span></span></a><nav class="console-nav"><a href="/">返回工作台 ↗</a><a href="/account">账号设置</a><button id="logout" class="text-button">退出</button></nav></header>
<div class="console-title"><p class="eyebrow">STUDIO MEMBERS</p><h1>邀请码与账号</h1><p>邀请新成员加入。每个账号拥有独立作品，注册始终需要有效邀请码。</p></div>
<p id="admin-status" class="console-status" role="status" aria-live="polite"></p>
<div class="console-grid"><section class="console-section"><h2>创建邀请码</h2><p class="section-copy">设置可注册人数与有效期，再把邀请码发给对方。</p><form id="invite-form"><label for="invite-label">备注</label><input id="invite-label" maxlength="60" placeholder="例如：工作室伙伴"><div class="input-row"><div><label for="invite-uses">可注册人数</label><input id="invite-uses" type="number" min="1" max="1000" value="1" required></div><div><label for="invite-days">有效天数</label><input id="invite-days" type="number" min="1" max="365" value="30" required></div></div><button id="create-invite" class="primary-action" type="submit"><span>生成邀请码</span><span aria-hidden="true">＋</span></button></form><div id="invite-result" class="invite-result" hidden><p>邀请码已生成。完整码仅在此时显示，请复制保存。</p><code id="invite-value"></code><button id="copy-invite" class="quiet-button">复制邀请码</button></div></section>
<section class="console-section"><h2>已创建的邀请码</h2><p class="section-copy">停用后不能继续注册，已注册账号不受影响。</p><div id="invite-list" class="table-scroll"></div></section></div>
<section class="console-section"><h2>成员账号</h2><p class="section-copy">停用将立即退出该账号的已有登录，作品仍保留。IP 仅向管理员显示。</p><div id="user-list" class="table-scroll"></div></section>
<details class="console-section"><summary>最近登录与管理记录</summary><div id="event-list" class="table-scroll"></div></details>
</main><script type="module" src="/admin.js"></script></body></html>
